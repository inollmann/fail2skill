# Evaluate a served policy (milestone M4): success rate per task, plus the failures it produces.
# ./al.sh serve lerobot --checkpoint <ckpt> --port 8300 --rename ...   (./al.sh train prints the command)
# ./al.sh collect configs/campaigns/eval_smolvla.yaml  ->  ./al.sh report data/episodes/eval_smolvla_iter0
name: eval_smolvla_iter0
driver: policy
num_envs: 12
seed: 7                          # different object layouts than the demonstrations (seed 100)
policy:
  port: 8300
  adapter: native
  open_loop_horizon: 8
  label: smolvla_iter0_8000      # which checkpoint is served, stored in every episode and in stats.jsonl
tasks: {stack: 1.0, beside_left: 1.0, beside_right: 1.0}
cameras: [exterior_1, exterior_2, wrist]
save:
  outcomes: [failure]            # the failures are the interesting part
  drop_tags: []
limits: {max_episodes: 120, max_hours: 2}
